<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smile Asana | Wisdom Library</title>
    <meta
      name="description"
      content="Smile Asana Wisdom Library: original reflections for presence, practice, movement, and teaching."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"

      <nav class="top-nav" aria-label="Smile Asana navigation">

        <a href="#reflections">Reflections</a>

      <section class="featured-card" id="featured-card" aria-live="polite"></section>

    <footer class="site-footer">
